name: portfolio-checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  supply-chain-case:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check demos/supply-chain/demo.js
      - name: Verify published analytics and bilingual assets
        run: node scripts/check-supply-chain.mjs
      - name: Verify bilingual project pages and visual references
        run: node scripts/check-portfolio-pages.mjs
