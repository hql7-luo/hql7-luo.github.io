.date-label:hover:not(:disabled) { background: var(--hover); }
.page-title { display: flex; flex-wrap: wrap; align-items: center; gap: 11px; margin-top: 4px; }
.page-title h1 { font-size: clamp(1.87rem, 5.9vw, 2.62rem); line-height: 1.2; letter-spacing: -.035em; font-weight: 730; }
.state-chip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; padding: 4px 8px; border: 1px solid var(--border); color: var(--muted); background: var(--inset); border-radius: 999px; font-size: .75rem; line-height: 1.35; }
.state-chip span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.sample-chip span { background: var(--amber); }
.page-actions { display: flex; gap: 9px; }
.page-actions .button { flex: 1 1 0; }
.button {
  min-height: 43px; padding: 9px 14px; display: inline-flex; align-items: center; justify-content: center;
  gap: 7px; border-radius: 12px; border: 1px solid var(--border); background: var(--inset);
  color: var(--text); font-weight: 675; font-size: .925rem; line-height: 1.25; white-space: nowrap;
  transition: background-color .15s, border-color .15s;
}
.button:hover:not(:disabled) { background: var(--hover); }
.button.primary { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.button.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, var(--text)); }
.button.quiet { background: transparent; border-color: transparent; color: var(--muted); }
.button.danger { color: var(--danger); }
.icon-button { width: 38px; height: 38px; padding: 0; display: inline-grid; place-items: center; flex: 0 0 auto; border-radius: 8px; color: var(--muted); }
.icon-button:hover { background: var(--hover); color: var(--text); }
.text-link { color: var(--accent-text); font-size: .875rem; font-weight: 650; text-underline-offset: 4px; }
.text-link:hover { text-decoration: underline; }
.fine { color: var(--muted); font-size: .8125rem; line-height: 1.6; }
.muted { color: var(--muted); }
.inline-actions { display: flex; gap: 7px; align-items: center; }
.wrap { flex-wrap: wrap; }
.inline-heading { display: flex; justify-content: space-between; align-items: center; gap: 9px; }

/* Dashboard cards */
.dashboard-grid, .dashboard-column, .subpage-grid, .progress-layout { display: grid; gap: 13px; align-content: start; align-items: start; min-width: 0; }
.dashboard-grid > .dashboard-column { display: contents; }
.budget-card { order: 1; }
.activity-card { order: 2; }
.meals-card { order: 3; }
.today-workouts { order: 4; }
.weight-card { order: 5; }
.card { border: 1px solid var(--border); background: var(--panel); border-radius: 18px; min-width: 0; }
.card.padded, .activity-card, .weight-card, .today-workouts, .budget-card, .meals-card { padding: 16px; }
.card-head { display: flex; gap: 10px; justify-content: space-between; align-items: center; min-height: 28px; }
.card-head h2 { display: inline-flex; align-items: center; gap: 8px; font-size: 1.02rem; font-weight: 725; line-height: 1.35; letter-spacing: .015em; }
.card-head h2 > svg { color: var(--muted); }
.card-head .text-link { flex: none; }
.card.padded > .card-head { margin-bottom: 13px; }
.card.form-stack > .card-head { margin-bottom: 0; }
.loading-card { padding: 34px 22px; color: var(--muted); }
.energy-summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 12px 0 15px; }
.energy-primary { display: grid; align-content: start; gap: 4px; min-width: 0; color: var(--muted); font-size: .875rem; }
.energy-primary dd { display: flex; align-items: baseline; flex-wrap: wrap; gap: 3px 5px; margin: 0; }
.energy-primary strong { color: var(--text); font-size: clamp(2.1rem, 9vw, 3.45rem); line-height: 1; letter-spacing: -.055em;
  font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.energy-balance { border-left: 1px solid var(--border); padding-left: 12px; }
.energy-balance strong { color: var(--accent-text); }
.energy-measures { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 9px; }
.energy-measures dt { color: var(--muted); font-size: .8125rem; }
.energy-measures dd { margin: 0; color: var(--soft); font-weight: 690; font-size: 1.1rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.energy-measures dd small { color: var(--muted); font-weight: 500; font-size: .72rem; white-space: nowrap; }
.energy-progress { height: 8px; margin-bottom: 8px; }
.energy-notes { display: grid; gap: 4px; margin-bottom: 12px; }
.budget-card[data-over="true"] .energy-budget strong { color: var(--danger); }
.budget-card[data-over="true"] .energy-progress { --macro: var(--danger); }
.macros { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; border-top: 1px solid var(--border); padding-top: 13px; }
.macro { --macro: var(--accent); min-width: 0; }
.macro.carbs { --macro: var(--amber); }
.macro.fat { --macro: var(--violet); }
.macro-title { color: var(--soft); font-size: .875rem; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.macro-title > span { width: 7px; height: 7px; border-radius: 50%; background: var(--macro); }
.macro p { line-height: 1.15; margin: 8px 0; white-space: nowrap; }
.macro p strong { font-size: clamp(1rem,4.15vw,1.42rem); letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
.macro p span { font-size: clamp(.67rem,2.8vw,.82rem); color: var(--muted); }
.macro small { color: var(--muted); white-space: nowrap; font-size: .75rem; }
progress { display: block; appearance: none; width: 100%; height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; border: 0; }
progress::-webkit-progress-bar { background: var(--track); border-radius: 999px; }
progress::-webkit-progress-value { background: var(--macro,var(--accent)); border-radius: 999px; }
progress::-moz-progress-bar { background: var(--macro,var(--accent)); border-radius: 999px; }
.activity-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; margin-top: 13px; }
.activity-option { min-width: 0; min-height: 47px; display: flex; align-items: center; gap: 7px; text-align: left; border: 1px solid var(--border);
  background: var(--inset); border-radius: 10px; padding: 8px 9px; color: var(--muted); }
.activity-option > span { flex: 1; font-size: .8125rem; font-weight: 675; line-height: 1.25; color: var(--soft); }
.activity-option > small { display: none; color: var(--subtle); font-size: .75rem; white-space: nowrap; }
.activity-option[aria-pressed="true"] { border-color: color-mix(in srgb, var(--accent) 44%, var(--border)); background: var(--tint); color: var(--accent-text); }
.activity-option[aria-pressed="true"] > span { color: var(--accent-text); }
.activity-option:hover { background: var(--hover); }
.activity-note { margin: 10px 0 0; color: var(--subtle); font-size: .8125rem; }
.weight-highlight { display: flex; align-items: baseline; gap: 10px; margin-top: 9px; }
.weight-highlight strong { font-size: 2.06rem; letter-spacing: -.055em; line-height: 1; }
.weight-highlight div span { font-size: .87rem; color: var(--muted); }
.weight-caption { margin-left: auto; color: var(--muted); font-size: .8125rem; }
.weight-plot { margin-top: 8px; }
.weight-plot svg { width: 100%; display: block; overflow: visible; }
.weight-plot text { fill: var(--muted); font-family: inherit; font-size: 10.5px; }
.plot-grid { stroke: var(--border); stroke-width: 1; fill: none; stroke-dasharray: 3 4; }
.plot-actual, .plot-average { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.plot-average { stroke: var(--amber); stroke-width: 1.5; stroke-dasharray: 4 4; opacity: .75; }
.weight-card-footer { display: flex; justify-content: space-between; gap: 5px; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 11px; color: var(--muted); font-size: .8125rem; }
.inner-text { margin-top: 10px; font-size: .875rem; }
.tile-icon { width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 9px; flex: 0 0 auto; background: var(--hover); color: var(--muted); }
.ink-lime { background: var(--tint); color: var(--accent-text); }
.ink-amber, .meal-breakfast { color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, var(--panel)); }
.meal-lunch { color: var(--accent-text); background: var(--tint); }
.meal-dinner { color: var(--blue); background: color-mix(in srgb, var(--blue) 13%, var(--panel)); }
.meal-snack { color: var(--violet); background: color-mix(in srgb, var(--violet) 13%, var(--panel)); }
.meal-groups { display: grid; margin-top: 12px; }
.meal-group + .meal-group { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 8px; }
.meal-heading { display: flex; align-items: center; gap: 9px; margin-bottom: 3px; }
.meal-heading :is(h3, h4) { flex: 1; font-size: .922rem; font-weight: 700; }
.meal-kcal { color: var(--soft); white-space: nowrap; font-size: .925rem; font-weight: 670; }
.meal-kcal small { color: var(--muted); font-weight: 500; }
.log-line, .workout-line { display: flex; align-items: center; gap: 7px; min-width: 0; min-height: 46px; }
.log-line { padding-left: 42px; }
.log-name { flex: 1; display: flex; flex-direction: column; align-items: flex-start; text-align: left; min-width: 0; line-height: 1.35; padding: 4px 0; }
.log-name:is(button):hover strong { color: var(--accent-text); }
.log-name strong { font-size: .9rem; overflow-wrap: anywhere; font-weight: 650; }
.log-name span, .line-kcal { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.line-kcal { text-align: right; min-width: 27px; }
.workout-list { margin-top: 7px; }
.workout-entry + .workout-entry, .history-row + .history-row { border-top: 1px solid var(--border); }
.workout-exercises, .workout-note { margin: 0 0 8px 41px; color: var(--muted); font-size: .8rem; overflow-wrap: anywhere; }
.workout-exercises { display: grid; gap: 4px; }
.workout-exercises li { display: flex; flex-wrap: wrap; justify-content: space-between; column-gap: 8px; }
.workout-exercises strong { color: var(--soft); }
.log-line .icon-button, .workout-line .icon-button { opacity: .78; }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 123px; gap: 9px; padding: 15px 8px; }
.empty p { color: var(--muted); font-size: .875rem; }
.empty .tile-icon { color: var(--accent-text); background: var(--tint); }

/* Details, lists and settings */
.form-stack { display: grid; gap: 13px; min-width: 0; }
.form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; min-width: 0; }
.form-grid.four { grid-template-columns: repeat(2,minmax(0,1fr)); }
.field { display: grid; align-content: start; gap: 5px; min-width: 0; color: var(--soft); font-size: .875rem; font-weight: 620; }
.field small { color: var(--muted); font-weight: 500; }
.field :is(input, textarea, select) {
  box-sizing: border-box; width: 100%; min-height: 43px; max-width: 100%; padding: 9px 10px;
  border: 1px solid var(--border); border-radius: 9px; background: var(--inset); color: var(--text);
  font: inherit; font-weight: 500; font-size: 1rem;
}
.field textarea { resize: vertical; min-height: 68px; }
.field :is(input,textarea)::placeholder { color: var(--subtle); opacity: 1; }
.field select {
  appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat;
}
.field input[type="date"] { min-width: 0; }
.checkbox { display: flex; align-items: center; gap: 7px; font-size: .875rem; color: var(--soft); min-height: 30px; }
.checkbox input { accent-color: var(--accent); width: 17px; height: 17px; }
.segments { display: flex; gap: 3px; padding: 3px; border-radius: 10px; background: var(--inset); border: 1px solid var(--border); }
.segments button { flex: 1; display: flex; align-items: center; gap: 5px; justify-content: center; padding: 8px 5px; min-height: 35px;
  border-radius: 7px; color: var(--muted); font-weight: 640; font-size: .83rem; white-space: nowrap; }
.segments button[aria-pressed="true"] { color: var(--accent-text); background: var(--tint); }
.segments.compact { display: inline-flex; justify-self: start; }
.segments.compact button { padding: 3px 9px; min-height: 29px; }
html[lang="en"] .food-tabs button { min-width: 0; padding-inline: 4px; white-space: normal; overflow-wrap: anywhere; line-height: 1.2; }
.source-box, .notice, .review-suggestion { background: var(--inset); border: 1px solid var(--border); padding: 9px 11px; border-radius: 9px; }
.source-box p, .notice, .review-suggestion p { font-size: .875rem; color: var(--soft); }
.source-box p + p { margin-top: 4px; }
.notice { color: var(--accent-text); }
.error-text { color: var(--danger); font-size: .875rem; }
.badge { display: inline-flex; color: var(--accent-text); background: var(--tint); border-radius: 6px; margin: 0 7px 5px 0; padding: 2px 6px; font-size: .75rem; }
.return-today { min-height: 38px; padding-inline: 3px; }
.history-totals { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding-top: 10px; }
.history-totals strong { color: var(--accent-text); font-variant-numeric: tabular-nums; }
.history-totals span, .history-row { color: var(--muted); font-size: .875rem; }
.history-row { min-width: 0; min-height: 42px; display: flex; align-items: center; gap: 10px; padding: 4px 0; overflow-wrap: anywhere; }
.history-row > :first-child { flex: 1; }
.history-row strong { color: var(--text); }
.training-dates .calendar-day { min-height: 60px; gap: 3px; }
.training-dates .calendar-day strong { font-size: .74rem; white-space: nowrap; }
.training-dates .calendar-day span { font-size: .68rem; }
.training-day-records { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
.training-day-records h3 { font-size: .94rem; font-weight: 700; }
.training-stats { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 11px; margin-bottom: 15px; }
.training-stats div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.training-stats div > span, .training-stats small { color: var(--muted); font-size: .8125rem; }
.training-stats strong { font-size: 1.5rem; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.training-stats .leg-status { color: var(--accent-text); font-size: 1.15rem; }
.training-muscles > summary { width: fit-content; min-height: 34px; padding: 5px 2px; cursor: pointer; color: var(--muted); font-size: .875rem; }
.muscle-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 7px; margin: 12px 0; }
.muscle-grid div { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; padding: 7px 9px; border-radius: 8px;
  background: var(--inset); border: 1px solid var(--border); color: var(--soft); font-size: .875rem; }
.muscle-grid small { color: var(--muted); }
.goal-fields { display: grid; gap: 9px; min-width: 0; }
.goal-fields h3 { font-size: .94rem; font-weight: 700; }
.goal-fields + .goal-fields { padding-top: 13px; border-top: 1px solid var(--border); }
.exercise-editor { background: var(--inset); border: 1px solid var(--border); border-radius: 10px; padding: 9px; display: grid; gap: 9px; }
.exercise-label { display: grid; grid-template-columns: minmax(0,2fr) minmax(0,1fr) auto; gap: 7px; align-items: end; }
.progress-stats { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; margin-bottom: 9px; }
.progress-stats div { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; border-radius: 9px; background: var(--inset); border: 1px solid var(--border); }
.progress-stats div > span { font-size: .875rem; color: var(--soft); }
.progress-stats div > small { color: var(--muted); font-size: .75rem; }
.progress-stats strong { font-size: 1.43rem; letter-spacing: -.045em; }
.progress-stats .rate-value { font-size: 1.05rem; letter-spacing: 0; }
.chart-legend { display: flex; justify-content: flex-end; gap: 8px; color: var(--muted); font-size: .75rem; margin-top: 8px; }
.chart-legend span::before { content: ""; display: inline-block; vertical-align: middle; width: 13px; height: 2px; background: var(--accent); margin-right: 5px; }
.chart-legend span + span::before { background: var(--amber); }
.review-suggestion { margin: 9px 0; }
.review-suggestion p { margin-bottom: 6px; }
.capability-line { display: flex; justify-content: space-between; gap: 8px; font-size: .875rem; color: var(--muted); }
.capability-line > span:first-child { color: var(--soft); }
.user-email { overflow-wrap: anywhere; }

/* Dialogs and feedback */
.dialog-open { overflow: hidden; }
.dialog {
  position: fixed; inset: auto 0 0; width: 100%; max-width: none; max-height: min(94dvh, 790px);
  padding: 0; margin: 0; color: var(--text); background: var(--panel); border: 1px solid var(--border);
  border-radius: 18px 18px 0 0; box-shadow: var(--shadow); overflow: hidden;
}
.dialog[open] { display: flex; flex-direction: column; }
.dialog::backdrop { background: #060c08a9; backdrop-filter: blur(4px); }
.dialog-head { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--border); padding: 9px 13px 9px 16px; }
.dialog-head h2 { font-size: 1.23rem; line-height: 1.3; font-weight: 750; }
.dialog-content { flex: 1 1 auto; min-height: 0; padding: 13px 15px; overflow-y: auto; display: grid; grid-template-columns: minmax(0, 1fr);
  gap: 13px; align-content: start; overscroll-behavior: contain; }
.dialog-footer { flex: 0 0 auto; display: flex; align-items: center; justify-content: flex-end; gap: 7px; padding: 9px 15px max(10px, env(safe-area-inset-bottom)); border-top: 1px solid var(--border); }
.footer-total { flex: 1; display: flex; flex-direction: column; min-width: 0; line-height: 1.38; }
.footer-total strong { color: var(--accent-text); }
.footer-total span { color: var(--muted); font-size: .78rem; }
.review-list { display: grid; gap: 6px; scroll-margin: 9px; }
.review-list h3, .food-editor h3, .minor-heading { font-size: .97rem; font-weight: 700; }
.review-list h3 span { color: var(--muted); font-size: .82rem; margin-left: 4px; }
.review-item { background: var(--inset); border: 1px solid var(--border); padding: 6px 7px; border-radius: 9px; }
.review-row { display: flex; align-items: center; gap: 5px; min-width: 0; }
.review-name { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; overflow-wrap: anywhere; }
.review-name strong { font-size: .875rem; }
.review-name small { color: var(--muted); font-size: .75rem; }
.inline-kcal { flex: 0 0 auto; font-size: .875rem; }
.inline-kcal small { color: var(--muted); font-size: .7rem; }
.review-row .icon-button { width: 32px; }
.review-detail { margin: 3px 0 0 39px; color: var(--muted); font-size: .78rem; }
.review-detail .text-link { font-size: .79rem; }
.catalog-option { width: 100%; display: flex; gap: 8px; align-items: center; justify-content: space-between; min-height: 45px; text-align: left;
  border: 1px solid var(--border); background: var(--inset); padding: 7px 9px; border-radius: 9px; }
.catalog-option:hover { background: var(--hover); }
.catalog-option span { display: flex; flex-direction: column; min-width: 0; overflow-wrap: anywhere; }
.catalog-option strong { font-size: .875rem; }
.catalog-option small { color: var(--muted); font-size: .75rem; }
.catalog-option svg { color: var(--accent-text); }
.search-field { position: relative; }
.search-field svg { position: absolute; top: 13px; left: 10px; color: var(--muted); }
.search-field input { padding-left: 34px; }
.photo-box { min-height: 128px; display: grid; justify-items: center; align-content: center; gap: 7px; background: var(--inset); border: 1px dashed var(--border);
  color: var(--muted); border-radius: 10px; padding: 9px; font-size: .875rem; text-align: center; }
.photo-box img { display: block; width: auto; max-width: 100%; max-height: 225px; border-radius: 8px; object-fit: contain; }
.toast { position: fixed; z-index: 7; bottom: max(76px, calc(64px + env(safe-area-inset-bottom))); right: 12px; left: 12px;
  display: flex; align-items: center; gap: 8px; color: var(--soft); background: var(--panel); border: 1px solid var(--border); border-radius: 11px;
  padding: 6px 8px 6px 11px; box-shadow: var(--shadow); max-width: 450px; font-size: .875rem; }
.toast > span { flex: 1; }
.toast > svg { color: var(--accent-text); }

/* Adapt the same views to large and small screens. */
@media (min-width: 520px) {
  .main { padding-left: 23px; padding-right: 23px; }
  .page-heading { flex-direction: row; align-items: flex-end; justify-content: space-between; }
  .page-actions .button { flex: 0 0 auto; }
  .activity-option > small { display: inline; }
  .form-grid.four { grid-template-columns: repeat(4,minmax(0,1fr)); }
  .dialog { inset: 0; margin: auto; width: min(calc(100% - 30px), 480px); max-height: min(87dvh, 800px); border-radius: 17px; }
  .dialog.wide { width: min(calc(100% - 30px), 660px); }
  .dialog-head { padding-inline: 18px; }
  .dialog-content { padding: 16px 18px; }
  .dialog-footer { padding-inline: 18px; }
  .toast { left: auto; right: 20px; bottom: 75px; }
}
@media (min-width: 825px) {
  .app-shell { display: grid; grid-template-columns: 186px minmax(0,1fr); }
  .mobile-bar, .bottom-nav { display: none; }
  .sidebar { position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; gap: 39px; padding: 24px 13px 16px;
    border-right: 1px solid var(--border); background: var(--rail); }
  .sidebar .brand { margin-left: 6px; }
  .sidebar nav { display: flex; flex-direction: column; gap: 6px; }
  .sidebar nav a { display: flex; align-items: center; gap: 11px; min-height: 43px; padding: 7px 10px; color: var(--muted); font-size: .9375rem;
    border-radius: 9px; font-weight: 640; border: 1px solid transparent; }
  .sidebar nav a[aria-current] { color: var(--accent-text); background: var(--tint); border-color: color-mix(in srgb,var(--accent) 17%, var(--border)); }
  .sidebar nav a:hover { background: var(--hover); }
  .sidebar-bottom { margin-top: auto; display: grid; gap: 10px; }
  .sidebar-theme { display: flex; align-items: center; gap: 9px; color: var(--muted); padding: 8px 7px; font-size: .8125rem; border-radius: 7px; }
  .sidebar-theme:hover { background: var(--hover); }
  .main { width: 100%; padding: 31px 25px 40px; }
  .page-heading { margin-bottom: 21px; }
  .page-actions { gap: 9px; }
  .dashboard-grid { grid-template-columns: minmax(0,1.24fr) minmax(0,1fr); }
  .dashboard-grid > .dashboard-column { display: grid; }
  .dashboard-grid > .dashboard-column > * { order: initial; }
  .subpage-grid { grid-template-columns: minmax(0,1.17fr) minmax(0,1fr); }
  .progress-stats { grid-template-columns: repeat(4,minmax(0,1fr)); }
  .activity-option > small { display: none; }
  .plot-large { max-width: 1050px; margin-inline: auto; }
  .toast { bottom: 22px; }
}
@media (min-width: 1120px) {
  .app-shell { grid-template-columns: 220px minmax(0,1fr); }
  .sidebar { padding-inline: 17px; }
  .main { padding: 39px 34px 48px; }
  .page-heading { margin-bottom: 25px; }
  .dashboard-grid, .dashboard-column, .subpage-grid, .progress-layout { gap: 18px; }
  .card.padded, .activity-card, .weight-card, .today-workouts, .budget-card, .meals-card { padding: 19px 20px; }
  .macros { gap: 18px; padding-top: 15px; }
  .activity-grid { gap: 9px; }
  .activity-option { padding: 8px 11px; }
  .activity-option > span { font-size: .875rem; }
  .activity-option > small { display: inline; }
}
@media (max-width: 365px) {
  .day-figures dd small { display: block; }
  .main { padding-inline: 12px; }
  .card.padded, .activity-card, .weight-card, .today-workouts, .budget-card, .meals-card { padding: 13px; }
  .activity-option { padding-inline: 6px; }
  .progress-layout .segments.compact button { padding-inline: 5px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
}

.storage-notice { margin-bottom: 13px; }
