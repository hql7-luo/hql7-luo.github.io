<style>@layer theme,base,components,utilities;@layer base{/*
  1. Prevent padding and border from affecting element width. (https://github.com/mozdevs/cssremedy/issues/4)
  2. Remove default margins and padding
  3. Reset all borders.
*/

*,
::after,
::before,
::backdrop,
::file-selector-button {
  box-sizing: border-box; /* 1 */
  margin: 0; /* 2 */
  padding: 0; /* 2 */
  border: 0 solid; /* 3 */
}

/*
  1. Use a consistent sensible line-height in all browsers.
  2. Prevent adjustments of font size after orientation changes in iOS.
  3. Use a more readable tab size.
  4. Use the user's configured `sans` font-family by default.
  5. Use the user's configured `sans` font-feature-settings by default.
  6. Use the user's configured `sans` font-variation-settings by default.
  7. Disable tap highlights on iOS.
*/

html,
:host {
  line-height: 1.5; /* 1 */
  -webkit-text-size-adjust: 100%; /* 2 */
  tab-size: 4; /* 3 */
  font-family: --theme(
    --default-font-family,
    -apple-system,
    BlinkMacSystemFont,
    'Segoe UI',
    Roboto,
    'Helvetica Neue',
    'Noto Sans',
    Arial,
    sans-serif,
    'Apple Color Emoji',
    'Segoe UI Emoji',
    'Segoe UI Symbol',
    'Noto Color Emoji'
  ); /* 4 */
  font-feature-settings: --theme(--default-font-feature-settings, normal); /* 5 */
  font-variation-settings: --theme(--default-font-variation-settings, normal); /* 6 */
  -webkit-tap-highlight-color: transparent; /* 7 */
}

/*
  1. Add the correct height in Firefox.
  2. Correct the inheritance of border color in Firefox. (https://bugzilla.mozilla.org/show_bug.cgi?id=190655)
  3. Reset the default border style to a 1px solid border.
*/

hr {
  height: 0; /* 1 */
  color: inherit; /* 2 */
  border-top-width: 1px; /* 3 */
}

/*
  Add the correct text decoration in Chrome, Edge, and Safari.
*/

abbr:where([title]) {
  -webkit-text-decoration: underline dotted;
  text-decoration: underline dotted;
}

/*
  Remove the default font size and weight for headings.
*/

h1,
h2,
h3,
h4,
h5,
h6 {
  font-size: inherit;
  font-weight: inherit;
}

/*
  Reset links to optimize for opt-in styling instead of opt-out.
*/

a {
  color: inherit;
  -webkit-text-decoration: inherit;
  text-decoration: inherit;
}

/*
  Add the correct font weight in Edge and Safari.
*/

b,
strong {
  font-weight: bolder;
}

/*
  1. Use the user's configured `mono` font-family by default.
  2. Use the user's configured `mono` font-feature-settings by default.
  3. Use the user's configured `mono` font-variation-settings by default.
  4. Correct the odd `em` font sizing in all browsers.
*/

code,
kbd,
samp,
pre {
  font-family: --theme(
    --default-mono-font-family,
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    'Liberation Mono',
    'Courier New',
    monospace
  ); /* 1 */
  font-feature-settings: --theme(--default-mono-font-feature-settings, normal); /* 2 */
  font-variation-settings: --theme(--default-mono-font-variation-settings, normal); /* 3 */
  font-size: 1em; /* 4 */
}

/*
  Add the correct font size in all browsers.
*/

small {
  font-size: 80%;
}

/*
  Prevent `sub` and `sup` elements from affecting the line height in all browsers.
*/

sub,
sup {
  font-size: 75%;
  line-height: 0;
  position: relative;
  vertical-align: baseline;
}

sub {
  bottom: -0.25em;
}

sup {
  top: -0.5em;
}

/*
  1. Remove text indentation from table contents in Chrome and Safari. (https://bugs.chromium.org/p/chromium/issues/detail?id=999088, https://bugs.webkit.org/show_bug.cgi?id=201297)
  2. Correct table border color inheritance in all Chrome and Safari. (https://bugs.chromium.org/p/chromium/issues/detail?id=935729, https://bugs.webkit.org/show_bug.cgi?id=195016)
  3. Remove gaps between table borders by default.
*/

table {
  text-indent: 0; /* 1 */
  border-color: inherit; /* 2 */
  border-collapse: collapse; /* 3 */
}

/*
  Use the modern Firefox focus style for all focusable elements.
*/

:-moz-focusring:where(:not(iframe)) {
  outline: auto;
}

/*
  Add the correct vertical alignment in Chrome and Firefox.
*/

progress {
  vertical-align: baseline;
}

/*
  Add the correct display in Chrome and Safari.
*/

summary {
  display: list-item;
}

/*
  Make lists unstyled by default.
*/

ol,
ul,
menu {

}

/*
  1. Make replaced elements `display: block` by default. (https://github.com/mozdevs/cssremedy/issues/14)
  2. Add `vertical-align: middle` to align replaced elements more sensibly by default. (https://github.com/jensimmons/cssremedy/issues/14#issuecomment-634934210)
      This can trigger a poorly considered lint error in some tools but is included by design.
*/

img,
svg,
video,
canvas,
audio,
iframe,
embed,
object {
  display: block; /* 1 */
  vertical-align: middle; /* 2 */
}

/*
  Constrain images and videos to the parent width and preserve their intrinsic aspect ratio. (https://github.com/mozdevs/cssremedy/issues/14)
*/

img,
video {
  max-width: 100%;
  height: auto;
}

/*
  1. Inherit font styles in all browsers.
  2. Remove border radius in all browsers.
  3. Remove background color in all browsers.
  4. Ensure consistent opacity for disabled states in all browsers.
*/

button,
input,
select,
optgroup,
textarea,
::file-selector-button {
  font: inherit; /* 1 */
  font-feature-settings: inherit; /* 1 */
  font-variation-settings: inherit; /* 1 */
  letter-spacing: inherit; /* 1 */
  color: inherit; /* 1 */
  border-radius: 0; /* 2 */
  background-color: transparent; /* 3 */
  opacity: 1; /* 4 */
}

/*
  Restore default font weight.
*/

:where(select:is([multiple], [size])) optgroup {
  font-weight: bolder;
}

/*
  Restore indentation.
*/

:where(select:is([multiple], [size])) optgroup option {
  padding-inline-start: 20px;
}

/*
  Restore space after button.
*/

::file-selector-button {
  margin-inline-end: 4px;
}

/*
  Reset the default placeholder opacity in Firefox. (https://github.com/tailwindlabs/tailwindcss/issues/3300)
*/

::placeholder {
  opacity: 1;
}

/*
  Set the default placeholder color to a semi-transparent version of the current text color in browsers that do not
  crash when using `color-mix(…)` with `currentcolor`. (https://github.com/tailwindlabs/tailwindcss/issues/17194)
*/

  (contain-intrinsic-size: 1px) /* Safari 17+ */ {
  ::placeholder {
    color: color-mix(in oklab, currentcolor 50%, transparent);

/*

}

/*

}

/*

  2. Ensure text alignment can be changed on date/time inputs in iOS Safari.
*/

  min-height: 1lh; /* 1 */
  text-align: inherit; /* 2 */
}

/*

*/

  display: inline-flex;
}

/*
  Remove excess padding from pseudo-elements in date/time inputs to ensure consistent height across browsers.
*/

  padding: 0;
}

::-webkit-datetime-edit,
::-webkit-datetime-edit-year-field,
::-webkit-datetime-edit-month-field,
::-webkit-datetime-edit-day-field,
::-webkit-datetime-edit-hour-field,
::-webkit-datetime-edit-minute-field,
::-webkit-datetime-edit-second-field,
::-webkit-datetime-edit-millisecond-field,
::-webkit-datetime-edit-meridiem-field {
  padding-block: 0;
}

/*
  Center dropdown marker shown on inputs with paired `<datalist>`s in Chrome. (https://github.com/tailwindlabs/tailwindcss/issues/18499)
*/

::-webkit-calendar-picker-indicator {
  line-height: 1;
}

/*
  Remove the additional `:invalid` styles in Firefox. (https://github.com/mozilla/gecko-dev/blob/2f9eacd9d3d995c937b4251a5557d95d494c9be1/layout/style/res/forms.css#L728-L737)
*/

:-moz-ui-invalid {

}

/*
  Correct the inability to style the border radius in iOS Safari.
*/

button,
input:where([type='button'], [type='reset'], [type='submit']),
::file-selector-button {
  appearance: button;

/*

*/

  height: auto;
}

*/

/* Neutral surfaces keep attention on the numbers and primary actions. */

html, body { min-height: 100%; background: var(--bg); color: var(--text); }
body { margin: 0; font-size: 16px; line-height: 1.52; }
button, a, input, textarea, select { -webkit-tap-highlight-color: transparent; }
button, a { touch-action: manipulation; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .48; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
h1,h2,h3,p { margin: 0; }

small { font-size: .8125rem; }
svg { flex: none; }
input, textarea, select { min-width: 0; }

.skip:focus { top: 12px; }

/* Navigation and page frame */
.app-shell { min-height: 100dvh; }
.sidebar { display: none; }
.mobile-bar {
  display: flex; justify-content: space-between; align-items: center;
  min-height: 62px; padding: max(8px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
  border-bottom: 1px solid var(--border); background: var(--rail);
}
.brand { display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; }

  border: 1px solid var(--border); border-radius: 8px; color: var(--accent-text); background: var(--inset); font-size: .82rem; font-weight: 650; }

/* A single date grid works for a week, a month, or three stacked months. */

.calendar-day { min-height: 54px; padding: 3px 1px; display: flex; flex-direction: column; justify-content: center; align-items: center;
  gap: 1px; border: 1px solid var(--border); border-radius: 7px; background: var(--inset); font-variant-numeric: tabular-nums; }
.calendar-day.deficit { color: var(--good); background: var(--good-surface); }
.calendar-day.surplus { color: var(--amber); background: color-mix(in srgb, var(--amber) 12%, var(--inset)); }
.calendar-day.recorded { color: var(--accent-text); background: var(--tint); }

.calendar-day span { white-space: nowrap; }

.calendar-logs { display: grid; gap: 16px; align-items: start; }

@media (min-width: 560px) {
  .calendar-figures { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (min-width: 650px) {
  .calendar-logs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

  .calendar-quarter { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
.main { padding: 22px 16px 98px; max-width: 1280px; margin: 0 auto; }
.page-heading { display: flex; flex-direction: column; align-items: stretch; gap: 18px; margin-bottom: 17px; }
.date-label { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 4px 9px;
  font-size: .875rem; color: var(--accent-text); background: var(--inset); border: 1px solid var(--border); border-radius: 9px; }

/* Match the arrow buttons to the date picker's touch target. */

  width: 44px; height: 44px; color: var(--accent-text); border: 1px solid var(--border); background: var(--inset);
}

/* Dashboard cards */

.card { border: 1px solid var(--border); background: var(--panel); border-radius: 18px; min-width: 0; }

.energy-summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 12px 0 15px; }

  font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.macro small { color: var(--muted); white-space: nowrap; font-size: .75rem; }
progress { display: block; appearance: none; width: 100%; height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; border: 0; }

.activity-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; margin-top: 13px; }

/* Details, lists and settings */

.strength-compare > p { margin-top: 4px; }

.strength-readout[data-multiple="true"] { grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 3px; padding: 0; }
.strength-readout > div { display: grid; gap: 1px; min-width: 0; padding-block: 4px; overflow-wrap: anywhere; }
.strength-readout span, .strength-readout small { color: var(--muted); font-size: .745rem; }
.strength-readout strong { color: var(--accent-text); font-size: .875rem; }
.strength-readout .strength-step { min-width: 44px; min-height: 44px; border-color: transparent; background: transparent; }
.strength-readout .strength-step:hover:not(:disabled) { background: var(--hover); }
.strength-back svg { transform: rotate(180deg); }

/* The lists expose full dates and set details without chart interaction. */
.strength-disclosure { min-width: 0; }
.strength-view > .strength-disclosure { border-top: 1px solid var(--border); }
.strength-paired { border-bottom: 1px solid var(--border); }
.strength-pair-lists { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.strength-pair-lists > div > p { padding-left: 8px; }
.strength-disclosure summary { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 44px;
  padding: 6px 20px 6px 2px; color: var(--soft); list-style: none; cursor: pointer; font-size: .85rem; font-weight: 650; touch-action: manipulation; }
.strength-disclosure summary::-webkit-details-marker { display: none; }
.strength-disclosure summary::after { content: ""; position: absolute; right: 5px; top: 50%; width: 6px; height: 6px;
  border-bottom: 1.5px solid currentColor; border-right: 1.5px solid currentColor; transform: translateY(-70%) rotate(45deg); }
.strength-disclosure [open] > summary::after, .strength-disclosure[open] > summary::after { transform: translateY(-25%) rotate(225deg); }
.strength-disclosure summary:hover { color: var(--accent-text); }
.strength-disclosure summary small, .strength-session-list summary span { color: var(--muted); font-weight: 550; }
.strength-session-list summary span { text-align: right; overflow-wrap: anywhere; }
.strength-session-list details + details, .strength-data-list li + li { border-top: 1px solid var(--border); }
.strength-data-list { margin: 0; padding: 0; list-style: none; }
.strength-data-list li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2px 8px; padding: 6px 2px; font-size: .8125rem; overflow-wrap: anywhere; }
.strength-data-list strong { text-align: right; }
.strength-data-list :is(span, small) { color: var(--muted); }
.strength-data-list small { grid-column: 1 / -1; }
.strength-set-list { padding: 0 8px 9px; color: var(--soft); font-size: .8125rem; overflow-wrap: anywhere; }
.strength-set-list > div + div { margin-top: 7px; }
.strength-set-list ol { margin: 0; padding-inline-start: 20px; list-style: decimal; }
.strength-set-list li + li { margin-top: 4px; }
.strength-set-list li small { color: var(--muted); margin-inline-start: 6px; }
.strength-set-list li p { color: var(--muted); }
.strength-insights .strength-more { min-height: 44px; }
.strength-all { justify-self: start; }

@container (max-width: 335px) {
  .strength-filter-row { grid-template-columns: minmax(0, 1fr); gap: 7px; }
  .strength-plot-years [data-align="middle"] { display: none; }
  .strength-plot-years span { font-size: .6875rem; }
}

/* Local advice is compact until its dated evidence is opened. */
.health-advice { display: grid; align-content: start; gap: 12px; min-width: 0; }
.card.padded.health-advice > .card-head { margin-bottom: 0; }
.health-priority { display: grid; gap: 6px; padding: 11px 12px; border-radius: 10px; background: var(--tint); overflow-wrap: anywhere; }
.health-priority-heading { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 8px; color: var(--accent-text); }
.health-priority-heading small { color: var(--muted); }
.health-positive { display: flex; align-items: baseline; gap: 6px; color: var(--good); font-size: .88rem; }
.health-positive svg { align-self: start; margin-top: 3px; }
.health-disclosure { min-width: 0; }
.health-disclosure > summary {
  display: flex; align-items: center; gap: 7px; min-height: 38px;
  color: var(--accent-text); font-size: .88rem; font-weight: 680; cursor: pointer; list-style: none;
}
.health-disclosure > summary::-webkit-details-marker { display: none; }
.health-disclosure[open] > summary svg { transform: rotate(180deg); }
.health-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 7px 12px; margin: 6px 0 11px; }
.health-period { display: flex; max-width: 100%; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 9px; background: var(--inset); }
.health-period button { min-height: 34px; padding: 3px 8px; color: var(--muted); font-size: .85rem; border-radius: 6px; }
.health-period button[aria-pressed="true"] { color: var(--accent-text); background: var(--panel); font-weight: 710; }
.health-evidence-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16.5rem), 1fr)); align-items: start; gap: 8px; }
.health-evidence {
  display: grid; align-content: start; gap: 8px; min-width: 0; padding: 10px;
  border: 1px solid var(--border); border-radius: 10px; font-size: .88rem; overflow-wrap: anywhere;
}
.health-evidence h3 { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: .94rem; }
.health-evidence h3 svg { color: var(--muted); }
.health-evidence-metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; margin: 0; }
.health-evidence-metrics > div { min-width: 0; padding: 6px 7px; border-radius: 6px; background: var(--inset); }
.health-evidence-metrics dt, .health-detail-note, .health-evidence small { color: var(--muted); font-size: .8rem; }
.health-evidence-metrics dd { margin: 0; font-weight: 680; font-variant-numeric: tabular-nums; }
.health-evidence small, .health-evidence-line { display: block; font-weight: 450; }
.health-patterns, .health-sleep-change { display: grid; gap: 4px; margin: 0; padding: 7px 0 0; border-top: 1px solid var(--border); list-style: none; }
.health-muse { margin-top: 11px; white-space: pre-wrap; overflow-wrap: anywhere; }
.health-source { margin-top: 10px; }
